<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record Sales | chidoskyElectronics</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/employee.css">
    <link rel="stylesheet" href="../css/ui.css">

    <!-- Loaded in <head> so the theme is applied and the page is guarded before it paints -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth-utils.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth-guard.js" data-area="employee"></script>
</head>

<body class="emp-body">

    <!-- TOP BAR -->
    <header class="emp-topbar">

        <div class="emp-brand">
            <span class="emp-logo"><i class="bi bi-box-seam"></i></span>
            <span>chidosky<strong>Electronics</strong></span>
        </div>

        <div class="emp-top-actions">
            <span class="emp-date" id="currentDate"></span>

            <a class="emp-icon-btn" href="account.html" title="My account" aria-label="My account">
                <i class="bi bi-person-gear"></i>
            </a>

            <a class="emp-icon-btn" href="support.html" title="Help and support" aria-label="Help and support">
                <i class="bi bi-question-circle"></i>
            </a>

            <button id="themeToggle" class="emp-icon-btn" type="button" title="Toggle theme">
                <i class="bi bi-moon"></i>
            </button>

            <div class="emp-user">
                <span class="emp-avatar" id="userAvatar">?</span>
                <span class="emp-user-name" id="userName">Loading...</span>
            </div>

            <button class="emp-icon-btn" type="button" data-action="logout" title="Log out">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>

    </header>

    <main class="emp-main">

        <!-- GREETING & TODAY'S NUMBERS -->
        <section class="emp-hero">

            <div>
                <h1 id="greeting">Hello</h1>
                <p>Pick a product, set the quantity and record the sale.</p>
            </div>

            <div class="emp-stats">
                <div class="emp-stat">
                    <span>My sales today</span>
                    <strong id="statCount">0</strong>
                </div>
                <div class="emp-stat">
                    <span>Total today</span>
                    <strong id="statTotal">&#8358;0</strong>
                </div>
            </div>

        </section>

        <div class="emp-grid">

            <!-- PRODUCTS -->
            <section class="emp-panel">

                <div class="emp-panel-head">
                    <h2>Products</h2>

                    <div class="emp-search">
                        <i class="bi bi-search"></i>
                        <input id="productSearch" type="search" placeholder="Search products..." autocomplete="off">
                    </div>
                </div>

                <div id="productList" class="emp-product-list">
                    <p class="emp-empty">Loading products...</p>
                </div>

            </section>

            <!-- NEW SALE -->
            <aside class="emp-panel emp-sale">

                <h2>New sale</h2>

                <div id="saleEmpty" class="emp-sale-empty">
                    <i class="bi bi-hand-index-thumb"></i>
                    Select a product to start a sale.
                </div>

                <form id="saleForm" novalidate hidden>

                    <div class="emp-sale-product">
                        <strong id="saleProductName"></strong>
                        <span id="saleProductMeta"></span>
                    </div>

                    <label class="emp-label" for="saleQuantity">Quantity</label>
                    <div class="emp-stepper">
                        <button id="qtyMinus" type="button" aria-label="Decrease quantity">&minus;</button>
                        <input id="saleQuantity" type="number" min="1" step="1" value="1" inputmode="numeric">
                        <button id="qtyPlus" type="button" aria-label="Increase quantity">+</button>
                    </div>

                    <div class="emp-total-row">
                        <span>Total</span>
                        <strong id="saleTotal">&#8358;0</strong>
                    </div>

                    <button id="saleSubmit" class="emp-submit" type="submit">
                        <i class="bi bi-check2-circle"></i>
                        Record sale
                    </button>

                    <button id="saleCancel" class="emp-secondary" type="button">Cancel</button>

                </form>

                <div id="saleMessage" class="emp-message" role="status" hidden></div>

                <button id="printReceipt" class="emp-print" type="button" hidden>
                    <i class="bi bi-printer"></i> Print receipt
                </button>

            </aside>

        </div>

        <!-- MY SALES -->
        <section class="emp-panel emp-history">

            <h2>My recent sales</h2>

            <div class="emp-table-wrap">
                <table class="emp-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="num">Qty</th>
                            <th class="num">Total</th>
                            <th>Date &amp; time</th>
                        </tr>
                    </thead>
                    <tbody id="salesTable">
                        <tr><td class="is-empty" colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <!-- Only shown when printing -->
    <div id="receipt" class="emp-receipt" aria-hidden="true"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/employee.js"></script>

</body>
</html>
