<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | chidoskyElectronics</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-login.css">

    <script src="../js/core/theme.js"></script>
</head>

<body class="al-body">

    <button id="themeToggle" class="al-theme" type="button" title="Switch theme" aria-label="Switch theme">
        <i class="bi bi-moon"></i>
    </button>

    <main class="al-wrap">

        <div class="al-card">

            <div class="al-head">
                <p class="al-brand">chidosky<strong>Electronics</strong></p>
                <h1>Admin sign in</h1>
                <p class="al-sub">Manage products, stock, sales and your team.</p>
            </div>

            <div id="loginMessage" class="al-alert" role="alert" hidden></div>

            <form id="loginForm" novalidate>

                <div class="al-field">
                    <label for="email">Email</label>
                    <input id="email" autofocus type="email" autocomplete="username" placeholder="admin@yourshop.com" required>
                </div>

                <div class="al-field">
                    <label for="password">Password</label>
                    <div class="al-password">
                        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                        <button id="togglePassword" type="button" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <p class="al-forgot"><a href="forgot-password.html">Forgot password?</a></p>

                <button id="loginButton" class="al-submit" type="submit">
                    <span id="loginLabel">Sign in</span>
                    <span id="loginSpinner" class="al-spinner" hidden></span>
                </button>

            </form>

            <p class="al-switch">
                Not an administrator?
                <a href="employee-login.html">Employee sign in</a>
            </p>

        </div>

        <nav class="al-links" aria-label="More">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="support.html">Support</a>
        </nav>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/config.js"></script>
    <script src="../js/core/auth-utils.js"></script>
    <script src="../js/pages/login.js"></script>

</body>
</html>
